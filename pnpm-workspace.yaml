packages:
  # Web and desktop are first-class hosts; each app owns its platform graph.
  - "apps/*"
  - "packages/*"
  - "e2e"

catalog:
  react: "19.2.3"
  react-dom: "19.2.3"
  "@types/react": "^19.2.0"
  "@types/react-dom": "^19.2.0"
  typescript: "^5.9.3"
  "@types/node": "^25.0.10"
  # Office build tooling (UNI-684): builds vendored engine source without the
  # prepared ../genoffice tree; also satisfies vite's esbuild peer range.
  esbuild: "0.28.2"
  fast-xml-parser: "5.11.2"
  jszip: "3.10.1"
  utif2: "4.1.0"
  # Desktop packaging (UNI-836): packager is dev-only; production code never imports it.
  electron: "44.5.0"
  electron-builder: "26.15.3"
  zod: "^4.1.5"
  # Office engine PDF lane (UNI-688 / G2-05, Advisor-approved delta): pdfium WASM
  # (pin = vendored pdf2docx floor), pdf-lib serialize, hb-subset font subsetting,
  # pure-JS image codec (pngjs decode/encode + jpeg-js decode) replacing the
  # Electron nativeImage path.
  "@embedpdf/pdfium": "2.15.0"
  pdf-lib: "1.17.1"
  harfbuzzjs: "1.6.2"
  pngjs: "7.0.0"
  jpeg-js: "0.4.4"
  # XLSX renderer (UNI-824 / G3-05c): the genoffice sheets renderer is built on
  # Univer 0.25.1 (Apache-2.0). Individual packages only - never the
  # @univerjs/presets meta-package, which transitively drags 27 proprietary
  # @univerjs-pro/* packages into the lockfile (see the pin's create-univer.ts).
  # rxjs is a peer of every Univer package and pinned here once.
  "@univerjs/core": "0.25.1"
  "@univerjs/docs": "0.25.1"
  "@univerjs/docs-ui": "0.25.1"
  "@univerjs/engine-formula": "0.25.1"
  "@univerjs/engine-render": "0.25.1"
  "@univerjs/find-replace": "0.25.1"
  "@univerjs/preset-sheets-conditional-formatting": "0.25.1"
  "@univerjs/preset-sheets-core": "0.25.1"
  "@univerjs/preset-sheets-data-validation": "0.25.1"
  "@univerjs/preset-sheets-drawing": "0.25.1"
  "@univerjs/preset-sheets-filter": "0.25.1"
  "@univerjs/preset-sheets-find-replace": "0.25.1"
  "@univerjs/preset-sheets-note": "0.25.1"
  "@univerjs/preset-sheets-sort": "0.25.1"
  "@univerjs/preset-sheets-table": "0.25.1"
  "@univerjs/sheets": "0.25.1"
  "@univerjs/sheets-filter": "0.25.1"
  "@univerjs/sheets-formula": "0.25.1"
  "@univerjs/sheets-ui": "0.25.1"
  "@univerjs/themes": "0.25.1"
  "@univerjs/ui": "0.25.1"
  rxjs: "7.8.2"
  # xlsx-gateway's own runtime deps, needed when the vendored gateway domain
  # modules are bundled into the renderer artifact.
  numfmt: "3.2.6"
  "@tanstack/react-query": "^5.96.2"
  tailwindcss: "^4"
  "@tailwindcss/postcss": "^4"
  postcss: "^8"
  tailwind-merge: "^3.4.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  lucide-react: "^1.0.1"
  i18next: "^26.0.8"
  react-i18next: "^17.0.6"
  vitest: "^4.1.0"
  "@vitest/coverage-v8": "^4.1.0"
  jsdom: "26.1.0"
  "@vitejs/plugin-react": "^6.0.1"
  "@testing-library/react": "^16.3.2"
  "@testing-library/jest-dom": "^6.9.1"

  # State management — Zustand giữ client/view state; React Query giữ server state
  zustand: "^5.0.0"

  # Kéo-thả — board/swimlane (views) và kéo đổi thứ tự cột (ui) đều dùng
  "@dnd-kit/core": "^6.3.1"
  "@dnd-kit/sortable": "^10.0.0"
  "@dnd-kit/utilities": "^3.2.2"

  # Bảng và danh sách ảo hoá
  "@tanstack/react-table": "^8.21.3"
  "@tanstack/react-virtual": "^3.13.0"
  react-virtuoso: "^4.14.0"

  # i18n
  "@formatjs/intl-localematcher": "^0.8.4"
  eslint-plugin-i18next: "^6.1.4"

  # Markdown / toán học (packages/ui/markdown)
  katex: "^0.16.45"
  rehype-katex: "^7.0.1"
  remark-math: "^6.0.0"

  # Editor — TipTap (Multica baseline @ 3d37828e9, packages/views/editor)
  "@tiptap/core": "3.27.1"
  "@tiptap/extension-code-block-lowlight": "3.27.1"
  "@tiptap/extension-document": "3.27.1"
  "@tiptap/extension-highlight": "3.27.1"
  "@tiptap/extension-image": "3.27.1"
  "@tiptap/extension-link": "3.27.1"
  "@tiptap/extension-list": "3.27.1"
  "@tiptap/extension-mention": "3.27.1"
  "@tiptap/extension-paragraph": "3.27.1"
  "@tiptap/extension-placeholder": "3.27.1"
  "@tiptap/extension-table": "3.27.1"
  "@tiptap/extension-table-cell": "3.27.1"
  "@tiptap/extension-table-header": "3.27.1"
  "@tiptap/extension-table-row": "3.27.1"
  "@tiptap/extension-text": "3.27.1"
  "@tiptap/extension-typography": "3.27.1"
  "@tiptap/extensions": "3.27.1"
  "@tiptap/markdown": "3.27.1"
  "@tiptap/pm": "3.27.1"
  "@tiptap/react": "3.27.1"
  "@tiptap/starter-kit": "3.27.1"
  "@tiptap/suggestion": "3.27.1"
  lowlight: "^3.3.0"
  mermaid: "^11.14.0"

  # Product analytics (packages/core/analytics)
  posthog-js: "^1.176.1"

  # Animation loading cho StatusPill
  unicode-animations: "^1.0.3"

  # Animation cho landing page (apps/web/features/landing). Chỉ app web khai
  # báo hai gói này; phần còn lại của sản phẩm dùng `motion`, và
  # apps/web/eslint.config.mjs chặn hai chiều để chúng không trộn vào nhau.
  gsap: "^3.13.0"
  "@gsap/react": "^2.1.2"
  three: "0.186.0"
  "@types/three": "0.186.0"

  # Testing
  "@testing-library/user-event": "^14.6.1"

  # UI primitives (packages/ui) — cố định một lần để views dùng lại cùng phiên bản
  "@base-ui/react": "^1.3.0"
  cmdk: "^1.1.1"
  motion: "^12.38.0"
  react-markdown: "^10.1.0"
  react-resizable-panels: "^4.7.5"
  recharts: "3.8.0"
  rehype-raw: "^7.0.0"
  rehype-sanitize: "^6.0.0"
  remark-breaks: "^4.0.0"
  remark-gfm: "^4.0.1"
  shiki: "^3.21.0"
  sonner: "^2.0.7"
  vaul: "^1.1.2"
  date-fns: "^4.1.0"

  # Desktop renderer fonts, bundled offline (apps/office-desktop)
  "@fontsource-variable/inter": "^5.3.0"
  "@fontsource-variable/plus-jakarta-sans": "^5.3.0"
  "@fontsource-variable/jetbrains-mono": "^5.3.0"

  # Calendar hub month view (packages/views/calendar)
  "@fullcalendar/core": "^6.1.19"
  "@fullcalendar/react": "^6.1.19"
  "@fullcalendar/daygrid": "^6.1.19"
  "@fullcalendar/timegrid": "^6.1.19"
  "@fullcalendar/interaction": "^6.1.19"
