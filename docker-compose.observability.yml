# Observability profile for docker-compose.prod.yml (spec §8):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.observability.yml up
# Small on-prem installs skip this file entirely; the API works without it.
services:
  server:
    environment:
      METRICS_ADDR: 0.0.0.0:9090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_FORMAT: json

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9091:9090"]
    depends_on: [server, blackbox]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports: ["3100:3100"]

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
