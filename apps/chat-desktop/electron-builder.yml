# Packaging config only (D1): no signing, no notarization, no updater — D2.
appId: com.uniworkos.chat
productName: UniChat
directories:
  buildResources: build
  # Not `dist/`: electron-vite writes dist/main and dist/preload there, and a
  # previous package must never be repacked into the next one.
  output: dist/package
files:
  - dist/main/**
  - dist/preload/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
protocols:
  - name: UniChat
    schemes:
      - uniworkchat
mac:
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: UniChat dùng micro cho cuộc gọi thoại và video.
    NSCameraUsageDescription: UniChat dùng camera cho cuộc gọi video.
  artifactName: unichat-${version}-mac-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: unichat-${version}-windows-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: unichat
  category: Network
  artifactName: unichat-${version}-linux-${arch}.${ext}
publish: null
npmRebuild: false
