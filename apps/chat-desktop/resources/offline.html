<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>UniChat</title>
    <!-- Canvas DeskGateStates (B). No network here, so no web fonts: the system face stands in for both. -->
    <style>
      :root {
        --bg: #ffffff; --ink: #14171f; --muted: #5f6673;
        --tile: #fff6d6; --tile-ink: #8a4f04; --brand: #0a52e6; --on-brand: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #161616; --ink: #f8f9fa; --muted: #a1a1aa; --tile: #3a2a06; --tile-ink: #f5c35b; --brand: #0a52e6; --on-brand: #ffffff; }
      }
      html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
      /* The macOS shell has no title bar: the whole page moves the window, the button still clicks. */
      main { -webkit-app-region: drag; }
      button { -webkit-app-region: no-drag; }
      main { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 48px; text-align: center; }
      .tile { width: 64px; height: 64px; border-radius: 20px; background: var(--tile); color: var(--tile-ink); display: flex; align-items: center; justify-content: center; }
      h1 { margin: 24px 0 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 8px 0 0; max-width: 400px; font-size: 15px; line-height: 22px; color: var(--muted); }
      button { height: 44px; margin-top: 28px; padding: 0 24px; border: 0; border-radius: 22px; background: var(--brand); color: var(--on-brand); font-family: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
      .next { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; line-height: 18px; font-variant-numeric: tabular-nums; }
      .ring { animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <span class="tile" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" /><path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" /><path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" /></svg>
      </span>
      <h1>Không kết nối được tới UniChat</h1>
      <p>Kiểm tra mạng của bạn. Ứng dụng sẽ tự thử lại sau vài giây.</p>
      <button id="retry" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg>
        Thử lại ngay
      </button>
      <p class="next" aria-live="polite">
        <svg class="ring" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
        <span id="next">Tự thử lại sau 5 giây</span>
      </p>
    </main>
    <script>
      // main passes its app URL in the query; only http(s) is followed.
      var app = new URLSearchParams(location.search).get("app");
      var retry = function () { if (app && /^https?:\/\//.test(app)) location.replace(app); };
      window.addEventListener("online", retry);
      document.getElementById("retry").addEventListener("click", retry);
      // main retries the app URL every 5 s (offline.ts OFFLINE_RETRY_MS); the line counts down to it.
      var left = 5;
      var next = document.getElementById("next");
      setInterval(function () {
        left = left > 1 ? left - 1 : 5;
        next.textContent = "Tự thử lại sau " + left + " giây";
      }, 1000);
    </script>
  </body>
</html>
