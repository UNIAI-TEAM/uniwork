<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>UniChat</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; }
      @media (prefers-color-scheme: dark) { html, body { background: #1c1c1e; color: #f5f5f7; } }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; opacity: 0.7; }
      button { margin-top: 8px; padding: 8px 16px; font: inherit; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Không kết nối được tới UniChat</h1>
      <p>Kiểm tra mạng của bạn. Ứng dụng sẽ tự thử lại sau vài giây.</p>
      <button id="retry" type="button">Thử lại ngay</button>
    </main>
    <script>
      // main passes its app URL in the query; only http(s) is followed.
      var app = new URLSearchParams(location.search).get("app");
      var retry = function () { if (app && /^https?:\/\//.test(app)) location.replace(app); };
      window.addEventListener("online", retry);
      document.getElementById("retry").addEventListener("click", retry);
    </script>
  </body>
</html>
