# Signing the test account in, the way a person does it. The app's own sign-in screen (ADR 0047, spec §5.2):
# the email and password fields by testID, then the app, with no browser. A build from before the native screen
# (the upgrade path's first half runs last night's) shows no email field: it signs in as that build does, in the
# system browser sheet (ASWebAuthenticationSession on iOS, a Chrome Custom Tab on Android), where the web signs the
# account in and the consent page hands the callback back. There is no test-only shortcut in any build. A restored
# session skips all of it.
#
# The browser pages belong to the web app: text, not ids. Patterns cover vi and en because the app and the web follow
# the device and browser language.
appId: com.uniworkos.chat.staging
---
- extendedWaitUntil:
    visible: "Sign in|Đăng nhập|Chat|Trò chuyện|Choose a workspace|Chọn workspace"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: login-email
    commands:
      - tapOn:
          id: login-email
      - inputText: ${MAESTRO_TEST_EMAIL}
      - tapOn:
          id: login-password
      - inputText: ${MAESTRO_TEST_PASSWORD}
      # The keyboard can cover the button on a short screen: its own key submits the form.
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "Chat|Trò chuyện|Choose a workspace|Chọn workspace"
          timeout: 30000
- runFlow:
    when:
      visible: "Sign in|Đăng nhập"
      notVisible:
        id: login-email
    commands:
      - tapOn: "Sign in|Đăng nhập"
      # iOS asks first: '"UniChat (Staging)" Wants to Use "…" to Sign In'.
      - runFlow:
          when:
            visible: "Continue|Tiếp tục"
          commands:
            - tapOn: "Continue|Tiếp tục"
      # A browser that still holds a web session goes straight to consent. The field labels, not the email
      # field's placeholder: Chrome hands a placeholder to UI Automator as a hint, which Maestro does not match,
      # and a tap on a label focuses its field.
      - extendedWaitUntil:
          visible: "Email|Allow .+ to sign in.|Cho phép .+ đăng nhập."
          timeout: 30000
      - runFlow:
          when:
            visible: "Email"
          commands:
            - tapOn: "Email"
            - inputText: ${MAESTRO_TEST_EMAIL}
            - tapOn: "Password|Mật khẩu"
            - inputText: ${MAESTRO_TEST_PASSWORD}
            # Enter submits the form; the page title and its button share "Log in".
            - pressKey: Enter
      # The consent page opens on its title; its button sits below the app, device, account and server details,
      # off a phone's first screen, and the browser leaves off-screen elements out of the hierarchy.
      - extendedWaitUntil:
          visible: "Allow .+ to sign in.|Cho phép .+ đăng nhập."
          timeout: 30000
      - scrollUntilVisible:
          element:
            text: "Allow desktop app|Cho phép ứng dụng desktop"
          direction: DOWN
          timeout: 15000
      - tapOn: "Allow desktop app|Cho phép ứng dụng desktop"
      - tapOn: "(Open|Mở) .+"
      - extendedWaitUntil:
          visible: "Chat|Trò chuyện|Choose a workspace|Chọn workspace"
          timeout: 30000
