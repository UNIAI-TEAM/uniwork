# Golden flow 1: a fresh install signs in through the system browser, opens
# the test room from the conversation list, sends a message and reads it back
# from the server after a cold start (a relaunch holds no local copy of a send
# the server already echoed, so seeing it again proves it landed).
appId: com.uniworkos.chat.staging
name: Sign in, read and send
tags:
  - golden
---
# SecureStore keeps the session in the keychain, which clearState leaves behind.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
# By link, so the flow needs the workspace's slugs and not its display name.
- openLink: uniworkchat://open?url=${encodeURIComponent('/' + MAESTRO_ORG_SLUG + '/' + MAESTRO_WS_SLUG + '/chat')}
- extendedWaitUntil:
    visible:
      id: room-row-${MAESTRO_ROOM_ID}
    timeout: 30000
- tapOn:
    id: room-row-${MAESTRO_ROOM_ID}
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- evalScript: ${output.stamp = 'Maestro ' + Date.now()}
- tapOn:
    id: composer-input
- inputText: ${output.stamp}
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible: .*${output.stamp}.*
    timeout: 15000
# Give the send time to reach the server: the list shows it as the room's last message.
- tapOn: "Back|Quay lại"
- extendedWaitUntil:
    visible:
      id: room-row-${MAESTRO_ROOM_ID}
      text: .*${output.stamp}.*
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: room-row-${MAESTRO_ROOM_ID}
    timeout: 30000
- tapOn:
    id: room-row-${MAESTRO_ROOM_ID}
- extendedWaitUntil:
    visible: .*${output.stamp}.*
    timeout: 30000
