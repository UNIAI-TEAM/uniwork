# Golden flow 1 (phase 1 half): a fresh install signs in through the system
# browser and lands in the test workspace. Reading and sending a message on
# M2a's screens is phase 2 (docs/superpowers/plans/2026-10-17-unichat-mobile-release.md).
appId: com.uniworkos.chat.staging
name: Sign in through the system browser
tags:
  - golden
---
# SecureStore keeps the session in the keychain, which clearState leaves behind.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
# By link, so the flow needs the workspace's slugs and not its display name.
- openLink: uniworkchat://open?url=${encodeURIComponent('/' + MAESTRO_ORG_SLUG + '/' + MAESTRO_WS_SLUG + '/chat')}
- extendedWaitUntil:
    visible: "Chat|Trò chuyện"
    timeout: 30000
