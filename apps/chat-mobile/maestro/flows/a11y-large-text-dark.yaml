# Accessibility smoke, on every PR that reaches the binary (mobile-verify.yml ›
# android-smoke), right after smoke-launch.yaml: the CI step first sets the
# emulator to its largest font scale (2.0) and to dark mode, then runs this
# flow and scripts/mobile-a11y-audit.mjs on the screen it leaves. On a PR that
# touches iOS (› ios-release) the simulator runs it too, at the largest
# Dynamic Type (accessibility-extra-extra-extra-large) and in dark mode. The sign-in
# screen must still show its copy and reach its fields and its button (the page
# scrolls rather than pushing them off the screen), and the button must work. No
# server: the build points at placeholder URLs, as in smoke-launch.yaml.
# The title must be on the first screen: it stops growing at DISPLAY_MAX_FONT_SCALE
# (components/auth/auth-layout.tsx). The line under it is body text that keeps
# scaling (AX5 is 3.57x), so on iOS it may start on the first screen and end below
# it; the flow scrolls until enough of it is visible rather than asserting it where
# it may be cut, and still asserts it. test/routes/sign-in-flows.test.tsx holds every
# text and id here to what the sign-in screen draws, in Vietnamese and in English.
appId: com.uniworkos.chat
name: Sign-in at the largest text size, in dark mode
tags:
  - smoke
  - a11y
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Log in to UniChat|Đăng nhập UniChat"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Use your UniWork account.|Dùng tài khoản UniWork của bạn."
    direction: DOWN
    visibilityPercentage: 50
    timeout: 10000
- assertVisible: "Use your UniWork account.|Dùng tài khoản UniWork của bạn."
- scrollUntilVisible:
    element:
      id: login-email
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: login-email
- scrollUntilVisible:
    element:
      id: login-button
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: login-button
# The browser's way in can still sit below the fold once the button is on screen, and iOS leaves off-screen
# text out of the hierarchy.
- scrollUntilVisible:
    element:
      text: "Log in with a browser|Đăng nhập bằng trình duyệt"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 10000
- assertVisible: "Log in with a browser|Đăng nhập bằng trình duyệt"
