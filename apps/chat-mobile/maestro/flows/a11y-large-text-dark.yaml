# Accessibility smoke, on every PR that reaches the binary (mobile-verify.yml ›
# android-smoke), right after smoke-launch.yaml: the CI step first sets the
# emulator to its largest font scale (2.0) and to dark mode, then runs this
# flow and scripts/mobile-a11y-audit.mjs on the screen it leaves. On a PR that
# touches iOS (› ios-release) the simulator runs it too, at the largest
# Dynamic Type (accessibility-extra-extra-extra-large) and in dark mode. The sign-in
# screen must still show its copy and reach its button (the page scrolls
# rather than pushing it off the screen), and the button must work. No server:
# the build points at placeholder URLs, as in smoke-launch.yaml.
# The welcome title must be on the first screen: at these sizes the decorative
# illustration gives way to the mark (components/brand/login-hero.tsx). The hint
# under it is body text that keeps scaling (AX5 is 3.57x: 16 pt becomes 57 pt,
# five or six lines on a 390 pt phone), so on iOS it may start on the first
# screen and end below it; the flow scrolls until the whole hint is visible
# rather than asserting it where it may be cut, and still asserts it.
appId: com.uniworkos.chat
name: Sign-in at the largest text size, in dark mode
tags:
  - smoke
  - a11y
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome to UniChat|Chào mừng đến với UniChat"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Message and call your team, right from your phone.|Nhắn tin và gọi cho cả đội ngay trên điện thoại."
    direction: DOWN
    timeout: 10000
- assertVisible: "Message and call your team, right from your phone.|Nhắn tin và gọi cho cả đội ngay trên điện thoại."
- scrollUntilVisible:
    element:
      id: login-button
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: login-button
- assertVisible: "Sign in with your UniWork account in the browser|Đăng nhập bằng tài khoản UniWork trong trình duyệt"
