# The upgrade path, first half (chat-mobile-verify.yml › android-upgrade, Android:
# Maestro toggles airplane mode there only): on last night's build, sign in,
# open the test room and leave one message waiting in the outbox with the
# network off. The workflow then installs tonight's APK over this one
# (adb install -r, as a store update does) and upgrade-after.yaml checks what
# survived. UPGRADE_STAMP (maestro -e) names the message for both halves.
appId: com.uniworkos.chat.staging
name: Before the upgrade, signed in with a message waiting
tags:
  - upgrade
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
- runScript: ../scripts/app-scheme.js
- openLink: ${output.scheme}://open?url=${encodeURIComponent('/' + MAESTRO_ORG_SLUG + '/' + MAESTRO_WS_SLUG + '/chat?room=' + MAESTRO_ROOM_ID)}
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: connection-banner-offline
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: ${UPGRADE_STAMP}
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible: .*${UPGRADE_STAMP}.*
    timeout: 10000
- stopApp
