# Local MinIO (S3-compatible) for uploads such as chat voice. Does not replace
# Postgres/Redis in docker-compose.yml.
#
#   make minio-up
#   # or: docker compose -f docker-compose.minio.yml up -d
#
# Then in .env (must match credentials and bucket below):
#   STORAGE_BACKEND=s3
#   AWS_ACCESS_KEY_ID=minioadmin
#   AWS_SECRET_ACCESS_KEY=minioadmin
#   AWS_ENDPOINT_URL=http://localhost:9000
#   S3_BUCKET=uniwork
#   S3_REGION=us-east-1
# Restart the API (`make start`). Console: http://localhost:9001
name: uniwork-minio
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/uniwork
        # Prefixes show as folders in the console; objects land under these keys.
        printf '' | mc pipe local/uniwork/chat/voice/.keep
        printf '' | mc pipe local/uniwork/chat/files/.keep
        printf '' | mc pipe local/uniwork/avatars/.keep
        echo "bucket uniwork ready (chat/voice, chat/files, avatars)"

volumes:
  minio_data:
