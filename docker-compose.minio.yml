# Local MinIO (S3-compatible) for uploads such as chat voice. Does not replace
# Postgres/Redis in docker-compose.yml.
#
#   make minio-up
#   # or: docker compose -f docker-compose.minio.yml up -d
#
# Then in .env (must match credentials and bucket below; FileService reads
# MINIO_* only, never AWS_*):
#   STORAGE_BACKEND=minio
#   MINIO_ENDPOINT=http://localhost:9000
#   MINIO_BUCKET=uniwork
#   MINIO_ACCESS_KEY_ID=minioadmin
#   MINIO_SECRET_ACCESS_KEY=minioadmin
#   MINIO_REGION=us-east-1
# Restart the API (`make start`). Console: http://localhost:9001
name: uniwork-minio
services:
  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub; this is
    # Bitnami's frozen legacy build, the same pin CI uses. It serves the API
    # on 9000 and the console on 9001 without a command.
    image: bitnamilegacy/minio:2025.7.23
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21
    depends_on:
      minio:
        condition: service_healthy
    # The image runs as a non-root user that cannot save `mc alias set`, so
    # the alias comes from the environment instead.
    environment:
      MC_HOST_uw: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc mb --ignore-existing uw/uniwork
        # Prefixes show as folders in the console; objects land under these keys.
        printf '' | mc pipe uw/uniwork/chat/voice/.keep
        printf '' | mc pipe uw/uniwork/chat-voice/.keep
        printf '' | mc pipe uw/uniwork/chat/files/.keep
        printf '' | mc pipe uw/uniwork/avatars/.keep
        echo "bucket uniwork ready (chat/voice, chat-voice, chat/files, avatars)"

volumes:
  minio_data:
