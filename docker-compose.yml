name: uniwork
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uniwork
      POSTGRES_USER: uniwork
      POSTGRES_PASSWORD: uniwork
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uniwork_test
      POSTGRES_USER: uniwork
      POSTGRES_PASSWORD: uniwork
    ports: ["5433:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
