name: UniAI link

# Every PR into develop/main must name its UniAI issue (UNI-nnn) in the title
# or body — docs/engineering/UNIAI_TRACKING.md § 1 rule 1. A PR labelled
# `no-issue` (maintainers only) gets a warning instead of a failure.

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: PR names a UniAI issue
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if printf '%s\n%s' "$TITLE" "$BODY" | grep -qE '\bUNI-[0-9]+\b'; then
            echo "ok: $(printf '%s\n%s' "$TITLE" "$BODY" | grep -oE '\bUNI-[0-9]+\b' | sort -u | tr '\n' ' ')"
            exit 0
          fi
          if printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'no-issue'; then
            echo "::warning::PR has no UniAI issue; allowed only because it is labelled no-issue"
            exit 0
          fi
          echo "::error::PR title or body must contain the UniAI issue key (UNI-nnn). Run: make issue-pr KEY=UNI-nnn, or add 'Issue: UNI-nnn' to the description."
          exit 1
