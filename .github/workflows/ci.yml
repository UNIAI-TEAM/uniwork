# Six jobs plus a secrets scan and a chart render check. `changes` decides
# whether the frontend half has anything to do; the two frontend jobs are
# split so the jsdom test suite and the Next build do not starve each other on
# a 4-vCPU runner; `backend-test` runs Go against real Postgres, Redis and
# MinIO services, sharded three ways because the suite is serialised per
# database, and `backend` merges their coverage and carries the status-check
# name; `e2e` builds the server and a production Next app against the same
# services plus MinIO for the file smoke tests, then runs the Playwright suite.
#
# turbo.json lists this file in globalDependencies: the toolchain versions
# pinned below are part of every task hash, so bumping Node can never replay
# results produced by the previous runtime.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.27.0"
  # The toolchain server/Dockerfile ships; govulncheck runs on it (see the
  # rest shard). GO-2026-6612 / 6613 are fixed in net/http from go1.27.2.
  GOVULN_GO_VERSION: "1.27.2"
  PNPM_VERSION: "10.28.2"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
      gate: ${{ steps.gate.outputs.level }}
    steps:
      - uses: actions/checkout@v4
      # docs/engineering/GATE_LEVELS.md — an unknown word resolves to strict.
      - id: gate
        run: |
          level="$(tr -d '[:space:]' < GATE_LEVEL 2>/dev/null || true)"
          case "$level" in fast|standard|strict) ;; *) level=strict ;; esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "GATE_LEVEL=$level"
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Bias toward over-matching: a missed path silently skips validation.
          filters: |
            frontend:
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - 'server/internal/service/reserved_slugs.json'
              # governance.test.mjs reads these; a ruleset change must run the
              # job that checks the ruleset.
              - 'CLAUDE.md'
              - 'AGENTS.md'
              - 'GATE_LEVEL'
              - '.githooks/**'
      - id: decide
        # Always run on push (main/develop); on a PR only when frontend paths changed.
        # The frontend jobs still run and report success in that case — their
        # steps are gated on this output — so the required check goes green
        # instead of staying pending.
        env:
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$FRONTEND_CHANGED" = "true" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-build:
    needs: changes
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: pnpm/action-setup@v4
        # Reads `packageManager` from package.json — one place pins pnpm.
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm install --frozen-lockfile
      # `node-version: 22` floats across patch releases and turbo's hash does
      # not include the interpreter; without the resolved version in the key a
      # runner moving to another 22.x would restore a cache built by the old
      # one and report green without executing anything.
      - id: runtime
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ steps.runtime.outputs.node }}-
      - name: Reserved slugs are generated from the server's list
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: |
          pnpm generate:reserved-slugs
          git diff --exit-code -- packages/core/paths/reserved-slugs.ts
      - name: Repo contract tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        # Catalog completeness, no usf branding left behind, the governance
        # wiring (AGENTS.md, hooks, doc/hook agreement), and the turbo
        # dependency-hash probe that proves `test` cannot replay a stale pass.
        run: |
          node --test scripts/catalog-check.test.mjs scripts/no-usf-leak.test.mjs scripts/no-legacy-tokens.test.mjs scripts/lucide-aliases.test.mjs scripts/governance.test.mjs scripts/env-example.test.mjs scripts/no-pii-log.test.mjs scripts/alerts-runbooks.test.mjs scripts/landing-artwork.test.mjs scripts/landing-marks.test.mjs scripts/landing-mascot.test.mjs scripts/landing-motion.test.mjs scripts/landing-studio.test.mjs scripts/office/check-boundaries.test.mjs scripts/office/installer-urls.test.mjs
          node scripts/office/check-boundaries.mjs
          bash scripts/turbo-cache-check.sh
      - name: Build, typecheck
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm exec turbo build typecheck
      - name: Lint (package boundaries are lint errors)
        # Through the root script, not `turbo lint`: scripts/lint-gate.sh is
        # what reads GATE_LEVEL. docs/adr/0014 — at fast the findings print and
        # the run continues; at standard and above they fail it as before.
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm lint
      - name: Bundle size budget
        # Initial JS ≤ 250 KB gzip, route chunks ≤ 150 KB (Vision §6.3, F-11).
        # docs/engineering/GATE_LEVELS.md — at GATE_LEVEL=fast the numbers are
        # measured, annotated and written to the job summary but do not fail
        # the run; standard and above enforce them. The table is printed either
        # way, so a route that grows is visible before it becomes a blocker.
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: node scripts/bundle-budget.mjs --print ${{ needs.changes.outputs.gate == 'fast' && '--warn-only' || '' }}
      - name: Known vulnerabilities (high+)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm audit --audit-level high

  frontend-test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: pnpm/action-setup@v4
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: pnpm install --frozen-lockfile
      - id: runtime
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      - if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ steps.runtime.outputs.node }}-
      # The real-gateway XLSX engine tests (packages/office-engine/test/xlsx-*.test.ts)
      # import .go-tmp/office-upstream-build/dist/xlsx-gateway.mjs. Without it they
      # skip with a warning, so CI builds the patched bundle from the vendored
      # upstream (public npm registry, lockfile-pinned; no Rust needed: the
      # native sidecar is not part of these tests) and the test step below sets
      # REQUIRE_XLSX_GATEWAY=1 so a missing bundle fails instead of skipping.
      - name: Build the patched xlsx gateway
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: node scripts/office/build-upstream.mjs
      - name: Unit tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        # `test` reaches dependency sources through the hash-only
        # `^cache-inputs` edge in turbo.json, so no tsc runs here.
        #
        # `pnpm test`, NOT `turbo test`: the root script carries
        # `--filter=!@uniwork/e2e`, and bare `turbo test` picks the e2e
        # workspace up through its own `test` script. That contradicts the
        # header of this file — Playwright is the local `make check` gate,
        # because it needs a running app and a browser, and this job has
        # neither. Running it here fails every spec on a missing browser
        # binary and says nothing about the change. Which workspaces the test
        # gate covers is defined once, in the root package.json.
        env:
          REQUIRE_XLSX_GATEWAY: "1"
        run: pnpm test

  # Stable status-check name for branch rules; fails when either half fails.
  frontend:
    needs: [frontend-build, frontend-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          BUILD_RESULT: ${{ needs.frontend-build.result }}
          TEST_RESULT: ${{ needs.frontend-test.result }}
        run: |
          echo "frontend-build: $BUILD_RESULT"
          echo "frontend-test:  $TEST_RESULT"
          if [ "$BUILD_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "::error::frontend validation failed"
            exit 1
          fi

  # Sharded because internal/testutil serialises every DB test behind one
  # advisory lock: two packages sharing a database take the sum of their times,
  # never the max. One Postgres per shard makes the wall clock the slowest
  # shard instead — internal/service and internal/handler alone accounted for
  # 834s and 431s of a single 1034s step. The static checks and govulncheck
  # ride on `rest`, the short shard. The coverage floor cannot live here: each
  # shard profiles only its own packages, so it is read in `backend` below.
  backend-test:
    needs: changes
    # Without this the matrix names the job after every key it carries, so the
    # check reads "backend-test (service, --skip-static)" in the PR and in
    # branch protection.
    name: backend-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: service
            static: "--skip-static"
          - shard: handler
            static: "--skip-static"
          - shard: rest
            static: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uniwork_test
          POSTGRES_USER: uniwork
          POSTGRES_PASSWORD: uniwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniwork -d uniwork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # MinIO for internal/storage's integration test, pinned to the same
      # image docker-compose.minio.yml uses. minio/minio and minio/mc are no
      # longer published on Docker Hub, so this is Bitnami's frozen legacy
      # build; MINIO_DEFAULT_BUCKETS creates the test bucket, and the only test
      # that makes a bucket (the versioned contract case) makes its own.
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # The image starts the server itself (a service container cannot
          # take a command) and creates this bucket before it reports healthy.
          MINIO_DEFAULT_BUCKETS: uniwork-test
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Go suite truncates every table, so it owns this database outright.
      # Each shard runs in its own job, so each gets its own service container.
      DATABASE_URL: postgres://uniwork:uniwork@localhost:5432/uniwork_test?sslmode=disable
      TEST_DATABASE_URL: postgres://uniwork:uniwork@localhost:5432/uniwork_test?sslmode=disable
      REDIS_TEST_URL: redis://localhost:6379/1
      JWT_SECRET: ci
      # Config refuses to start without a separate Markdown/HTML preview origin
      # and its capability secret (G3-08b); CI values, not secrets.
      PREVIEW_ORIGIN: http://localhost:3001
      PREVIEW_CAPABILITY_SECRET: ci-preview-capability-secret-0000000000
      PREVIEW_ASSET_TTL: 10m
      PREVIEW_ASSET_MAX_BYTES: "10485760"
      # Storage config and integration tests. The integration test skips when
      # MINIO_* is absent, so a fork without the service still gets a green Go
      # suite; here the service above is real, which is the point.
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: uniwork-test
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_REGION: us-east-1
      # docs/engineering/GATE_LEVELS.md — at GATE_LEVEL=fast a PR buys latency
      # with the race detector; the push to develop that follows the merge
      # still runs it, so no unraced suite reaches develop. Above fast, and on
      # every push, -race always runs.
      RACE: ${{ (needs.changes.outputs.gate != 'fast' || github.event_name != 'pull_request') && '--race' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Build
        if: ${{ matrix.shard == 'rest' }}
        run: cd server && go build ./...
      - name: Migrate the test database
        run: cd server && go run ./cmd/migrate up
      - name: Tests (${{ matrix.shard }})
        env:
          UNIWORK_GO_COVER_OUT: ${{ github.workspace }}/.go-tmp/cover-${{ matrix.shard }}.out
        run: bash scripts/test-go.sh $RACE --shard=${{ matrix.shard }} ${{ matrix.static }} --skip-floor
      # govulncheck judges the standard library of the Go that runs it, so it
      # runs on the toolchain server/Dockerfile ships (GOVULN_GO_VERSION), not
      # on GO_VERSION: staticcheck v0.8.1 cannot read go1.27.2 export data
      # yet, which keeps the build and the tests on 1.27.0. Move GO_VERSION up
      # and drop this step's setup-go once a staticcheck release supports it.
      - uses: actions/setup-go@v5
        if: ${{ matrix.shard == 'rest' }}
        with:
          go-version: ${{ env.GOVULN_GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: govulncheck
        if: ${{ matrix.shard == 'rest' }}
        # Reachability-based: only a vulnerability in a code path we call fails the job.
        run: cd server && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.shard }}
          path: .go-tmp/cover-${{ matrix.shard }}.out
          if-no-files-found: error

  # Stable status-check name for branch rules; fails when any shard fails.
  # Also the only place server/coverage.floor can be enforced: the floor is a
  # statement about the whole suite, and only the merged profile has that
  # denominator.
  backend:
    needs: backend-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Shard results
        env:
          SHARDS_RESULT: ${{ needs.backend-test.result }}
        run: |
          echo "backend-test: $SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::backend validation failed"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          merge-multiple: true
          path: .go-tmp
      - name: Coverage floor over the merged profile
        run: bash scripts/go-cover-floor.sh .go-tmp/cover-*.out

  # The Playwright specs CLAUDE.md calls a regression contract. Same shape as
  # scripts/check.sh step 5–6: real Postgres + Redis + MinIO, the server
  # binary, a
  # production Next build, then the suite against localhost. LiveKit and
  # SMTP stay unset — the specs are written for that (mail goes to the
  # `emails` outbox table, meetings run without a provider).
  # At GATE_LEVEL=fast the suite runs on push to develop/main only; a PR gets
  # lint, typecheck, unit and Go. Above fast it runs on every PR too.
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' && (needs.changes.outputs.gate != 'fast' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uniwork
          POSTGRES_USER: uniwork
          POSTGRES_PASSWORD: uniwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniwork -d uniwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # MinIO is the FileService destination of the server this job starts
      # (STORAGE_BACKEND=minio): smoke and e2e run on the real adapter.
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # The image starts the server itself (a service container cannot
          # take a command) and creates this bucket before it reports healthy.
          MINIO_DEFAULT_BUCKETS: uniwork-test
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://uniwork:uniwork@localhost:5432/uniwork?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-e2e-secret
      PORT: "8080"
      FRONTEND_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8080
      PREVIEW_ORIGIN: http://localhost:3001
      PREVIEW_CAPABILITY_SECRET: ci-e2e-preview-capability-secret-00000000
      PREVIEW_ASSET_TTL: 10m
      PREVIEW_ASSET_MAX_BYTES: "10485760"
      APP_ENV: development
      DEV_VERIFICATION_CODE: "123456"
      # The server writes every new file to MinIO; a missing or broken group
      # stops it at preflight, which the wait step below then reports.
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: uniwork-test
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_REGION: us-east-1
      # The pre-FileService destination stays readable during the cutover
      # (plan §7 step 1): the Bước 0 recording spec seeds a legacy /uploads
      # row there, and e2e/db.ts writes its object into this directory.
      LOCAL_UPLOAD_DIR: /tmp/uniwork-uploads
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      # e2e/office-shell.spec.ts runs only with this set. It seeds its own
      # account and DOCX file through the API (no OFFICE_DOCUMENT_URL) and
      # needs no Office engine service: the web DOCX host is in the Next build.
      OFFICE_SHELL_E2E: "1"
      # e2e/office-docs-web.spec.ts (UNI-1013). With the OFFICE_FRAME_SOURCE secret (an https
      # .tar.gz of the fork's pinned Docs build, docs/office/docs-web-frame.md) the frame cases
      # run; without it (a fork or a PR without secret access) the bundle is not installed and
      # the spec runs its "not installed -> G3" case instead. It needs no office engine: the PDF
      # step accepts the 503/501 print fallback.
      OFFICE_DOCS_WEB_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Migrate and start the server
        run: |
          cd server
          go run ./cmd/migrate up
          go build -o bin/server ./cmd/server
          nohup bin/server > /tmp/server.log 2>&1 &
      - name: Build and start the web app
        env:
          OFFICE_FRAME_SOURCE: ${{ secrets.OFFICE_FRAME_SOURCE }}
        run: |
          pnpm --filter @uniwork/web build
          # PORT above is the Go server's; `next start` reads the same variable.
          PORT=3000 nohup pnpm --filter @uniwork/web start > /tmp/web.log 2>&1 &
      - name: Wait for both
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          for i in $(seq 1 90); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/healthz && curl -sf http://localhost:3000 > /dev/null
          # Readiness includes the storage probe: MinIO must answer too.
          curl -sf http://localhost:8080/readyz
      - run: pnpm --filter @uniwork/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @uniwork/e2e test
      - if: failure()
        run: tail -n 100 /tmp/server.log /tmp/web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            /tmp/server.log
            /tmp/web.log
          if-no-files-found: ignore

  # Secrets by content, not by filename: the pre-commit hook refuses `.env`,
  # this catches a token pasted into a test fixture or a yaml.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action: the action demands a paid license
      # for organization repositories; the CLI is MIT and does the same scan.
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  # The Helm chart's render assertions (ci/scripts/render-uniwork-chart.sh):
  # required values, no LoadBalancer/NodePort, and the office engine pod shape
  # with officeEngine.enabled on and off. Seconds; no cluster.
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: bash ci/scripts/render-uniwork-chart.sh
