name: Meeting Agent Verify

# apps/meeting-agent (ADR 0037): the Python LiveKit worker of the AI scribe.
# Ruff and pytest only, beside the main CI workflow: it is not a pnpm/turbo
# workspace. Tests use the fake STT and never reach a LiveKit room or a vendor.

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/meeting-agent/**"
      - ".github/workflows/meeting-agent-verify.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/meeting-agent/**"
      - ".github/workflows/meeting-agent-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meeting-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/meeting-agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest
        run: python -m pytest -q
