name: Mobile Verify

# Adapted from usf .github/workflows/mobile-verify.yml. Everything UniChat
# mobile (apps/chat-mobile) must pass before it merges or ships, beside the
# main CI workflow, which filters the app out (ADR 0011: mobile never blocks a
# web/backend PR that does not touch what the app reads). Runs on every PR;
# the scope job decides what the change needs (scripts/mobile-native-scope.mjs).
#
#   scope           mobile=true when the change touches the app, what it
#                   imports or a contract its tests read (event catalogue,
#                   response SDOs); native=true when it reaches the binary
#   checks          typecheck, lint, the vitest unit suite (100% floor) and
#                   the jest-expo component and route suites, knip, the native
#                   module versions, ktlint over the local modules' Kotlin, the
#                   mobile repo contracts
#   doctor-bundle   expo-doctor, then `expo export` of the Android and iOS
#                   bundles with the production config, held to
#                   apps/chat-mobile/bundle-budget.json
#   android-release `expo prebuild` + `./gradlew :app:assembleRelease` on the
#                   production config: proves the native project still builds;
#                   the same Gradle run tests the calls module's Kotlin on
#                   Robolectric (`:unichat-calls:testReleaseUnitTest`).
#                   Only when the change reaches the binary
#                   (scripts/mobile-native-scope.mjs): the app's code, config
#                   or assets, the install graph, or a packages/core file the
#                   app imports at runtime. Always on a tag, on dispatch, on
#                   push to main/develop without a known base, and when the
#                   caller passes force_native (the release does).
#   android-smoke   installs that APK on an emulator and runs
#                   apps/chat-mobile/maestro/flows/smoke-launch.yaml: the app
#                   cold-starts to its sign-in screen and stays up; then times
#                   five cold starts and weighs the APK against
#                   apps/chat-mobile/perf-budget.json (scripts/mobile-perf.mjs);
#                   then runs the calls module's instrumented test APK
#                   (modules/unichat-calls/android/src/androidTest).
#   ios-release     `expo prebuild -p ios`, CocoaPods, an ad-hoc signed Release
#                   build for the simulator (no Apple account) on the Xcode
#                   XCODE_VERSION names (scripts/select-xcode.sh), then
#                   smoke-launch.yaml on a simulator. The scope's `ios` output:
#                   a PR, a push or a dispatch that needs the native build gets
#                   it; a caller gets it only when it passes `ios: true`, so the
#                   Android-only store release and OTA update neither wait for
#                   a macOS runner nor fail when only iOS breaks
#   gate            always runs last and fails unless every job the change
#                   needed succeeded (scripts/mobile-verify-gate.mjs): the one
#                   required status check (scripts/branch-protection.json), so
#                   a skipped or crashed job can never pass for a green one.
#
# Every check here blocks at every GATE_LEVEL (ADR 0037) once branch protection
# requires the gate (scripts/branch-protection.mjs --apply; until then a red
# run is advisory: runbook › Branch protection). No secret is read:
# the server URLs are placeholders (the app is built, never run), and EAS, the
# stores and Sentry are not reached. chat-mobile-release.yml calls this
# workflow on the SHA it releases, chat-mobile-update.yml on the SHA it
# publishes as an OTA update.

on:
  push:
    branches: [main, develop]
    # scripts/mobile-native-scope.mjs › MOBILE_PATHS, the same list (scripts/mobile-workflows.test.mjs).
    paths:
      - "apps/chat-mobile/**"
      - "packages/core/**"
      - "packages/eslint-config/**"
      - "packages/tsconfig/**"
      - "scripts/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "knip.json"
      - ".editorconfig"
      - ".easignore"
      - ".gitignore"
      - "**/.gitignore"
      - ".github/workflows/mobile-verify.yml"
      - ".github/workflows/chat-mobile-release.yml"
      - ".github/workflows/chat-mobile-verify.yml"
      - ".github/workflows/chat-mobile-update.yml"
      - ".github/workflows/chat-mobile-production.yml"
      - ".github/workflows/chat-mobile-promote.yml"
      - ".github/workflows/chat-mobile-release-health.yml"
      - "docs/runbooks/unichat-mobile-release.md"
      - "docs/events/CATALOGUE.md"
      - "server/internal/handler/dto/sdo/**"
      - "server/internal/handler/chat*.go"
      - "server/internal/handler/auth.go"
      - "server/internal/handler/identity.go"
      - "server/internal/handler/config.go"
      - "server/internal/handler/push_preview_policy.go"
      - "server/internal/handler/workspace.go"
      - "server/internal/handler/task.go"
      - "server/internal/config/unichat_downloads.go"
      - "server/internal/featureflags/keys.go"
  # Every pull request, no path filter: the gate job is a required status
  # check, and a workflow a filter keeps from starting leaves it pending for
  # ever. The scope job decides what the change needs; a PR outside the app
  # pays for two small jobs.
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      # Inside a called workflow the github context is the caller's, so "called"
      # cannot be detected: a re-pushed tag arrives as a push with a real
      # `before` SHA. The release passes true so its SHA always gets the build.
      force_native:
        description: Run android-release and android-smoke whatever the diff says
        type: boolean
        default: true
      # The callers ship Android only (the store release, the OTA update) until the
      # Apple account exists (UNI-1838): the iOS simulator build is then a PR and
      # nightly check, not a release blocker. The iOS release passes true.
      ios:
        description: Also run ios-release (only callers that ship an iOS binary)
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# A literal group: inside a called workflow `github.workflow` names the caller.
concurrency:
  group: mobile-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  EXPO_DOCTOR_VERSION: "1.21.4"
  # The same Maestro the nightly pins (chat-mobile-verify.yml).
  MAESTRO_VERSION: "2.11.0"
  # The Xcode the iOS simulator build uses, the same as the nightly's (chat-mobile-verify.yml).
  XCODE_VERSION: "27.0"
  # ktlint over the local Expo modules' Kotlin, with the release binary's checksum.
  KTLINT_VERSION: "1.5.0"
  KTLINT_SHA256: a16be01dcc480aab2f55f444b620142152f66e31564b3b9376506d624c28a2ad
  EXPO_NO_TELEMETRY: "1"

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.decide.outputs.mobile }}
      native: ${{ steps.decide.outputs.native }}
      ios: ${{ steps.decide.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: decide
        name: Does the change reach the native binary?
        env:
          EVENT: ${{ github.event_name }}
          # Empty outside workflow_call.
          FORCE_NATIVE: ${{ inputs.force_native }}
          WANT_IOS: ${{ inputs.ios }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$FORCE_NATIVE" = "true" ] || [[ "$REF" == refs/tags/* ]]; then
            # Called by the release (or any tag push): the shipped SHA is always built,
            # for iOS only when the caller ships iOS.
            ios=false
            if [ "$WANT_IOS" = "true" ]; then ios=true; fi
            printf 'mobile=true\nnative=true\nios=%s\n' "$ios" | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            # iOS builds whenever Android does.
            node scripts/mobile-native-scope.mjs --base "$PR_BASE" --head "$GITHUB_SHA" | sed -n 's/^native=/ios=/p' | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            node scripts/mobile-native-scope.mjs --base "$PUSH_BEFORE" --head "$GITHUB_SHA" | sed -n 's/^native=/ios=/p' | tee -a "$GITHUB_OUTPUT"
          else
            # Dispatched, or a push with no known base: build both.
            printf 'mobile=true\nnative=true\nios=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  checks:
    # Its display name before the split; branch protection requires the gate job, not this one.
    name: mobile
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit and component tests
        run: pnpm exec turbo typecheck lint test --filter=@uniwork/chat-mobile
      # Unused files, exports and dependencies, and imports of packages the app
      # does not declare: the drift the first EAS production build met (PR #387).
      - name: Dead code and dependencies (knip)
        run: pnpm knip --workspace apps/chat-mobile
      # Native modules against the versions the installed Expo SDK ships with
      # (its bundledNativeModules.json). Offline on purpose: online, the check
      # also asks for the newest patch Expo published today, which would turn
      # every PR red the day Expo releases one, whatever the PR changed.
      - name: Native module versions match the Expo SDK
        working-directory: apps/chat-mobile
        env:
          EXPO_OFFLINE: "1"
        run: pnpm exec expo install --check
      # The calls module's Kotlin (modules/*/android) compiles only in a native build, which a
      # JS-only PR skips: ktlint parses every file on every mobile PR. It caught a KDoc that
      # said "data/calls/*", whose "/*" opens a nested comment and leaves the file unclosed.
      # Style: .editorconfig › [*.{kt,kts}].
      - name: Kotlin lint (ktlint)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ktlint" "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          echo "$KTLINT_SHA256  $RUNNER_TEMP/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "apps/chat-mobile/modules/**/*.kt"
      - name: Mobile repo contracts
        run: node --test scripts/mobile-core-allowlist.test.mjs scripts/mobile-native-scope.test.mjs scripts/mobile-bundle-budget.test.mjs scripts/mobile-perf.test.mjs scripts/mobile-a11y-audit.test.mjs scripts/mobile-workflows.test.mjs scripts/mobile-knip.test.mjs scripts/mobile-web-copies.test.mjs scripts/mobile-lockfiles.test.mjs scripts/mobile-easignore.test.mjs scripts/mobile-verify-gate.test.mjs scripts/maestro-retry.test.mjs scripts/mobile-canary.test.mjs scripts/branch-protection.test.mjs scripts/mobile-coverage-floor.test.mjs scripts/mobile-play-release.test.mjs scripts/mobile-release-notes.test.mjs scripts/mobile-release-health.test.mjs scripts/mobile-docs.test.mjs scripts/mobile-data-layout.test.mjs

  doctor-bundle:
    name: expo-doctor and JS bundle budget
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The release configuration, with placeholder servers: the binary is built,
      # never run, so it needs URLs of the right shape, not real ones. Not on
      # the checks job, whose tests pin their own env.
      UNICHAT_ENV: production
      UNICHAT_API_URL: https://api.example.invalid
      UNICHAT_APP_URL: https://app.example.invalid
      # No Sentry credentials here: a release build must not try to upload source maps.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The app and what it imports only: other workspaces' prepare scripts
      # (the Office engine build) have no business on this runner.
      - run: pnpm install --frozen-lockfile --filter "@uniwork/chat-mobile..."
      - name: expo-doctor
        working-directory: apps/chat-mobile
        run: pnpm dlx "expo-doctor@${EXPO_DOCTOR_VERSION}"
      # Both platforms: Metro builds the iOS bundle on Linux, so iOS has a budget before it has a build.
      - name: Export the Android and iOS bundles
        working-directory: apps/chat-mobile
        run: pnpm exec expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/export" --dump-sourcemap
      - name: Bundle budget
        run: node scripts/mobile-bundle-budget.mjs "$RUNNER_TEMP/export"

  android-release:
    name: Android release build
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Same release configuration as doctor-bundle.
      UNICHAT_ENV: production
      UNICHAT_API_URL: https://api.example.invalid
      UNICHAT_APP_URL: https://app.example.invalid
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # The startup marks android-smoke times (data/logger.ts › perfMark); outside the fingerprint, never in a store build.
      UNICHAT_PERF_MARKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --filter "@uniwork/chat-mobile..."
      - name: Prebuild the native project
        working-directory: apps/chat-mobile
        run: pnpm exec expo prebuild -p android --no-install --clean
      - name: Assemble the release APK and run the calls module's JVM tests
        working-directory: apps/chat-mobile/android
        # One ABI, the emulator's: what can break is shared by all four, and it
        # halves the build. The nightly builds every ABI (android-production).
        # The calls module's Robolectric tests (modules/unichat-calls/android/src/test)
        # share the release compilation; Robolectric runs SDK 34 on this JDK 17.
        # :unichat-calls:assembleDebugAndroidTest builds the module's instrumented test APK
        # (src/androidTest), which android-smoke runs on its emulator.
        run: ./gradlew :app:assembleRelease :unichat-calls:testReleaseUnitTest :unichat-calls:assembleDebugAndroidTest --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unichat-calls-unit-tests
          path: |
            apps/chat-mobile/modules/unichat-calls/android/build/reports/tests/**
            apps/chat-mobile/android/**/unichat-calls/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
      - name: APK size
        working-directory: apps/chat-mobile/android/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          { echo "### UniChat Android release APK (x86_64)"; echo; ls -l *.apk | awk '{printf "- `%s`: %.1f MB\n", $9, $5/1048576}'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: unichat-release-apk
          path: apps/chat-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: unichat-calls-androidtest
          path: apps/chat-mobile/**/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  android-smoke:
    name: Android cold-start smoke
    needs: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # scripts/mobile-perf.mjs times the cold starts against apps/chat-mobile/perf-budget.json.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: unichat-release-apk
          path: ${{ runner.temp }}/apk
      - uses: actions/download-artifact@v4
        with:
          name: unichat-calls-androidtest
          path: ${{ runner.temp }}/androidtest
      # Maestro runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold start on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Then on the device (audit P1 Perf): the APK's size, and five cold starts timed to Android's first
          # frame and to the sign-in screen drawn under the lifted splash, each held to its ceiling. Last (audit
          # UX "no-device-a11y-verification"), at the largest font scale and in dark mode: the sign-in screen
          # still shows its copy and reaches its button, and every control on it is named and 48 dp a side.
          # Then (review P2) the calls module's instrumented test: an incoming call posted through
          # CallNotifications reaches System UI's shade as a call with Answer and Decline.
          script: |
            adb install "${{ runner.temp }}/apk/app-release.apk"
            cd apps/chat-mobile/maestro && ${{ github.workspace }}/scripts/maestro-retry.sh test flows/smoke-launch.yaml
            node scripts/mobile-perf.mjs apk "${{ runner.temp }}/apk/app-release.apk" --out "${{ runner.temp }}/perf-apk.json"
            node scripts/mobile-perf.mjs startup --package com.uniworkos.chat --mark first-screen --runs 5 --out "${{ runner.temp }}/perf-startup.json"
            node scripts/mobile-perf.mjs check "${{ runner.temp }}/perf-apk.json" "${{ runner.temp }}/perf-startup.json"
            adb shell settings put system font_scale 2.0
            adb shell cmd uimode night yes
            cd apps/chat-mobile/maestro && ${{ github.workspace }}/scripts/maestro-retry.sh test flows/a11y-large-text-dark.yaml
            node scripts/mobile-a11y-audit.mjs --package com.uniworkos.chat --out "${{ runner.temp }}/a11y-signin.json"
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night no
            adb install -r -t "${{ runner.temp }}"/androidtest/*.apk
            adb shell am instrument -w expo.modules.unichatcalls.test/androidx.test.runner.AndroidJUnitRunner | tee "${{ runner.temp }}/instrument.txt"
            grep -q '^OK (' "${{ runner.temp }}/instrument.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-smoke
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7

  ios-release:
    # Audit P1 "ios-never-built": iOS had no build anywhere a PR could see. A
    # Release build for the simulator needs no Apple account (ad-hoc signed),
    # proves prebuild, CocoaPods and Xcode still take the native project, and
    # the cold-start smoke proves the binary boots to its sign-in screen.
    name: iOS simulator release build
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Same release configuration as android-release.
      UNICHAT_ENV: production
      UNICHAT_API_URL: https://api.example.invalid
      UNICHAT_APP_URL: https://app.example.invalid
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Maestro runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: pnpm install --frozen-lockfile --filter "@uniwork/chat-mobile..."
      # SDK 57 needs Xcode 27. Pinned (XCODE_VERSION), never "the newest on the
      # image": a runner image update must not swap in another Xcode or a beta.
      - name: Select Xcode
        run: scripts/select-xcode.sh "$XCODE_VERSION"
      - name: Prebuild and install the pods
        working-directory: apps/chat-mobile
        run: pnpm exec expo prebuild -p ios --clean
      - name: Build Release for the simulator
        working-directory: apps/chat-mobile
        run: |
          set -euo pipefail
          workspace="$(ls -d ios/*.xcworkspace)"
          # Ad-hoc signing: the applinks entitlement needs a signature even on a
          # simulator, and an unsigned app cannot reach the keychain (SecureStore).
          xcodebuild -workspace "$workspace" -scheme "$(basename "$workspace" .xcworkspace)" \
            -configuration Release -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            build
      - name: Boot a simulator and install the app
        working-directory: apps/chat-mobile
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Release-iphonesimulator/*.app
          echo "UDID=$udid" >> "$GITHUB_ENV"
          { echo "### UniChat iOS simulator Release build"; echo; du -sh build/Build/Products/Release-iphonesimulator/*.app | awk '{printf "- `%s`: %s\n", $2, $1}'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Cold start reaches sign-in on the simulator
        working-directory: apps/chat-mobile/maestro
        run: ${{ github.workspace }}/scripts/maestro-retry.sh --device "$UDID" test flows/smoke-launch.yaml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-smoke-ios
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7

  gate:
    # The required status check (scripts/branch-protection.json): keep the name.
    name: UniChat mobile gate
    needs: [scope, checks, doctor-bundle, android-release, android-smoke, ios-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/mobile-verify-gate.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Every job this change needed passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/mobile-verify-gate.mjs
