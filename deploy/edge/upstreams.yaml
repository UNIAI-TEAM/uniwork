spec:
  scheme: http
  passHost: pass
  timeout: { connect: 5s, read: 60s, send: 60s }
  externalNodes:
    - type: Domain
      name: uniwork-fe.uniwork.svc.cluster.local
      port: 3000
      weight: 100
