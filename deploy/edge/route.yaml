apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: uniwork
  namespace: reap-edge
spec:
  ingressClassName: apisix
  http:
    # The preview origin is a separate hostname. Only the opaque asset broker
    # is reachable here; HTML is never served by this route.
    - name: uniwork-preview-assets
      priority: 250
      match:
        hosts: [preview.unicomhub.com]
        paths: [/api/v1/preview/assets/*]
      upstreams:
        - name: uniwork-be
    - name: uniwork-api
      priority: 200
      websocket: true
      match:
        hosts: [uniwork.unicomhub.com]
        paths: [/api, /api/*]
      upstreams:
        - name: uniwork-be
    - name: uniwork-web
      priority: 100
      websocket: true
      match:
        hosts: [uniwork.unicomhub.com]
        paths: [/, /*]
      upstreams:
        - name: uniwork-fe
