# LiveKit hostNetwork → uniwork-be webhook (Calico IPIP).
#
# LiveKit runs hostNetwork on a shared worker. Cross-node calls to ClusterIP
# appear with source = node IPv4IPIPTunnelAddr (not InternalIP, not
# reap-integrations namespace identity). NetworkPolicy on uniwork only allows
# reap-edge ingress, so webhook delivery times out until these tunnel /32s are
# allowed on :8080.
#
# Discover tunnel addr:
#   kubectl get nodes -l workload=shared \
#     -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.annotations.projectcalico\.org/IPv4IPIPTunnelAddr}{"\n"}{end}'
#
# Re-apply when LiveKit moves to another shared worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-livekit-hostnetwork-uniwork-webhook
  namespace: uniwork
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: uniwork
    reap.io/role: livekit-webhook-access
  annotations:
    reap.io/gate: "LK-001"
    reap.io/reason: hostNetwork-source-is-calico-ipip-tunnel-addr
    reap.io/cmc-guidance: "allow IPv4IPIPTunnelAddr not node InternalIP / namespaceSelector"
    reap.io/livekit-node: "reap-eng-prod-k8s-pool-data-worker-q6frs-x58q4"
    reap.io/tunnel-addr: "10.244.214.192"
    reap.io/webhook-url: "http://uniwork-be.uniwork.svc.cluster.local:8080/api/v1/integrations/livekit/webhook"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uniwork-be
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.244.96.64/32
        - ipBlock:
            cidr: 10.244.30.64/32
        - ipBlock:
            cidr: 10.244.7.64/32
        - ipBlock:
            cidr: 10.244.214.192/32
      ports:
        - protocol: TCP
          port: 8080
