# Prometheus for the `observability` compose profile. The API exposes metrics
# on a separate listener (METRICS_ADDR=0.0.0.0:9090 inside the compose network,
# 127.0.0.1:9090 when the process runs on a host directly).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: uniwork-api
    static_configs:
      - targets: ["server:9090"]

  # /readyz is JSON, not a metrics page, so it is probed through the blackbox
  # exporter; alerts use probe_success{job="readyz"}.
  - job_name: readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://server:8080/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
