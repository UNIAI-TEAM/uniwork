namespace: uniwork

imagePullSecrets:
  - name: harbor-registry

scheduling:
  workloads: [shared]
  tolerations: []

# Non-secret KEY=value files from deploy/app/env/*.env (helm --set-file).
env:
  beContent: ""
  feContent: ""
  officeEngineContent: ""

public:
  origin: https://uniworkos.com
  livekitUrl: wss://livekit.uniworkos.com:7880

be:
  # One replica until ADR 0025 §3 holds: several background loops (Email Hub
  # sends, digests, …) are unsafe on two replicas without a leader lock.
  replicaCount: 1
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-be
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  port: 8080
  # Prometheus listener. Must match METRICS_ADDR in deploy/app/env/uniwork-be.env
  # (the server only opens it when that variable is set).
  metricsPort: 9090
  # GOMEMLIMIT in deploy/app/env/uniwork-be.env tracks limits.memory (~80%).
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  secrets:
    database: { name: uniwork-db, key: DATABASE_URL }
    redis: { name: uniwork-redis, key: REDIS_URL }
    app: { name: uniwork-app, key: JWT_SECRET }
    preview: { name: uniwork-preview, key: PREVIEW_CAPABILITY_SECRET }
    livekitKey: { name: uniwork-livekit, key: LIVEKIT_API_KEY }
    livekitSecret: { name: uniwork-livekit, key: LIVEKIT_API_SECRET }
    # Optional — create when enabling mail / CMC S3 / Google OAuth.
    mail: { name: uniwork-mail, key: SMTP_PASSWORD }
    s3: { name: uniwork-s3, accessKey: AWS_ACCESS_KEY_ID, secretKey: AWS_SECRET_ACCESS_KEY }
    google: { name: uniwork-google, key: GOOGLE_CLIENT_SECRET }
    emailHub: { name: uniwork-email-hub, key: EMAIL_HUB_CREDENTIAL_KEY }
    # OpenRouter / OpenAI-compatible key (Email Hub AI, Ask UNI, meeting summary).
    openAPIKey: { name: uniwork-open-api-key, key: OPENAI_API_KEY }
    anthropicAPIKey: { name: uniwork-anthropic-api-key, key: ANTHROPIC_API_KEY }
    # The meeting agent's STT key, also used by the BE to transcribe meeting recordings.
    # Optional: without it nothing is transcribed and the recorder stays hidden.
    assemblyAIAPIKey: { name: uniwork-assemblyai-api-key, key: ASSEMBLYAI_API_KEY }
    # Expo access token for UniChat mobile push (enhanced push security). Optional:
    # create the Secret before turning enhanced push security on in the Expo project.
    expo: { name: uniwork-expo, key: EXPO_ACCESS_TOKEN }
    # Apple keys of UniChat on the iPhone, one Secret (deploy/app/env/README.md › Apple).
    # Optional: without the Secret the pod still starts with VoIP and Apple revoke off.
    # The team id is not secret and lives in uniwork-be.env (APNS_TEAM_ID, APPLE_SIWA_TEAM_ID).
    # apns: the APNs token-auth key for iPhone VoIP call pushes (ADR 0038); without it
    # iPhones keep the Expo call push. privateKey is the .p8 file's PEM.
    apns: { name: uniwork-apple, keyID: APNS_KEY_ID, privateKey: APNS_PRIVATE_KEY }
    # siwa: the Sign in with Apple key (ADR 0041) that signs the client secret of Apple's
    # token and revoke endpoints; without it sign-in works and account deletion cannot
    # revoke the Apple grant. Sign-in itself turns on with APPLE_SIWA_AUDIENCES.
    siwa: { name: uniwork-apple, keyID: APPLE_SIWA_KEY_ID, privateKey: APPLE_SIWA_PRIVATE_KEY }
    # Office engine credentials (same Secret as officeEngine.secrets). Optional:
    # without them the BE has no engine and refuses office jobs.
    officeEngineServiceToken: { name: uniwork-office-engine, key: OFFICE_ENGINE_SERVICE_TOKEN }
    officeEngineGrantKey: { name: uniwork-office-engine, key: OFFICE_ENGINE_GRANT_KEY }

fe:
  # The Next app keeps no per-pod state (no route handlers, middleware, ISR or
  # server actions; every pod of one image serves the same build), so two
  # replicas ride out a node drain or a crash. A PodDisruptionBudget is
  # rendered whenever this is above 1.
  replicaCount: 2
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-fe
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }

networkPolicy:
  # Calico IPv4IPIPTunnelAddr of the node running LiveKit hostNetwork
  # (reap-eng-prod-k8s-pool-data-worker-q6frs-x58q4 after the four-worker shrink).
  livekitTunnelCidr: "10.244.214.192/32"
  # Namespace of the in-cluster Prometheus allowed to scrape be.metricsPort.
  # Empty renders no rule: the port stays closed to every other pod.
  metricsScrapeNamespace: ""
  # Egress of the office engine to the file store. NetworkPolicy matches IPs,
  # not DNS names — CMC S3 hn-2 A records (re-check if the endpoint moves).
  officeEngineFileStore:
    - { cidr: "113.20.100.19/32", port: 443 }
    - { cidr: "113.20.100.20/32", port: 443 }

# Office engine (apps/office-engine): always on in production. Non-secret env is
# deploy/app/env/uniwork-office-engine.env (helm --set-file env.officeEngineContent).
# Secrets: uniwork-office-engine (SERVICE_TOKEN + GRANT_KEY). Chart sets
# OFFICE_ENGINE_URL on the BE to the in-cluster Service.
officeEngine:
  enabled: true
  replicaCount: 1
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-office-engine
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  # Must match OFFICE_ENGINE_PORT in uniwork-office-engine.env.
  port: 8090
  # tmpfs pages count against the memory limit: 1Gi /tmp (2 workers x 512 MiB
  # temp — a 200 MiB job holds input + output + headroom on disk) + 2 x 512 MiB
  # job RSS + the service itself stays under 2560Mi.
  # Measured (SIZE-OPS1, framed input, arm64): two concurrent 200 MiB jobs
  # (odt->docx convert + xlsx open) peaked at 769 MiB cgroup memory, 386 MiB of
  # it /tmp, no OOM. The request is that peak x 1.25. The limit keeps the full
  # tmpfs budget plus job RSS: those jobs wrote small outputs, and a job whose
  # output is as large as its input fills /tmp further.
  tmpSizeLimit: 1Gi
  terminationGracePeriodSeconds: 15
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 2560Mi }
  securityContext:
    # The supervisor runs as uid 0 to drop each worker to its slot uid; every
    # capability it does not need stays dropped (compose cap_add list). The
    # container also sets allowPrivilegeEscalation=false (no-new-privileges)
    # and readOnlyRootFilesystem. Compose caps the container at pids_limit 256;
    # a pod spec has no per-pod pids field, so enforce the same ceiling on the
    # node with the kubelet `podPidsLimit: 256` (KubeletConfiguration) for the
    # nodes that carry this pool.
    addCapabilities: [CHOWN, SETUID, SETGID, KILL, DAC_OVERRIDE, FOWNER]
  # Existing Secret (created out of band) holding the two engine credentials.
  # The BE reads the same Secret through be.secrets.officeEngine*.
  secrets:
    # Service credential the BE sends; >= 32 chars.
    serviceToken: { name: uniwork-office-engine, key: OFFICE_ENGINE_SERVICE_TOKEN }
    # Grant signing key; >= 32 chars and DIFFERENT from the service token.
    grantKey: { name: uniwork-office-engine, key: OFFICE_ENGINE_GRANT_KEY }

# AI scribe agent (apps/meeting-agent, ADR 0045; spec 2026-10-20-meeting-scribe-agent-design
# §4.6). On together with MEETING_SCRIBE_ENABLED=true in uniwork-be.env.
# Scale is the CPU HPA (75%); keda.enabled stays false, so no ScaledObject.
# LiveKit keys reuse uniwork-livekit (same Secret as the BE). STT key is
# uniwork-assemblyai-api-key / ASSEMBLYAI_API_KEY.
meetingAgent:
  enabled: true
  agentName: uniwork-scribe
  sttProvider: assemblyai
  # Live STT host (SCRIBE_STT_BASE_URL). Empty follows batch transcription:
  # the EU streaming host when env.beContent sets AI_MEETING_TRANSCRIBE_BASE_URL
  # to AssemblyAI's EU API, else the US one (spec parent §7.5: one region).
  sttBaseUrl: ""
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-meeting-agent
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  healthPort: 8081
  # Prometheus endpoint of the worker (scribe_* metrics, multiprocess mode).
  metricsPort: 9100
  # Same public URL the BE hands to clients (public.livekitUrl). Signaling
  # resolves to the shared ELB; ICE host candidates are the livekit node's
  # private address because useExternalIp is false. Both are in egress.livekit.cidrs.
  livekitUrl: wss://livekit.uniworkos.com:7880
  # Sized for the two nodes this chart may land on. pool-exam is 4 vCPU / 8 GiB
  # (allocatable 3720m / ~7 GiB) and already runs the exam workload, so a
  # 4 CPU / 8 GiB request cannot schedule there. One pod requests 500m / 1 GiB
  # and is capped at 1 CPU / 2 GiB. maxReplicas 3 is the ceiling across both
  # nodes; measure a real meeting before raising either number (benchmark #13).
  minReplicas: 1
  maxReplicas: 1
  # Scale on meetings per pod instead of CPU (benchmark #13): KEDA reads
  # scribe_jobs_running from Prometheus and keeps about jobsPerPod meetings on
  # each pod; prescale holds prescale.replicas from a few minutes before each
  # hour, when meetings start together. Needs KEDA in the cluster; with it on,
  # the chart's CPU HPA is not rendered (KEDA owns its own HPA). Off by default.
  keda:
    enabled: false
    # Release reap-kube-prometheus-stack in reap-observability.
    prometheusUrl: http://reap-kube-prometheus-stack-prometheus.reap-observability.svc:9090
    # About two meetings on a 1 CPU / 2 GiB pod (LiveKit's 10–25 jobs was for 4 CPU / 8 GiB).
    jobsPerPod: 2
    prescale:
      enabled: true
      timezone: Asia/Ho_Chi_Minh
      # Working hours, 5 minutes before each hour until 5 minutes past it.
      start: "55 7-17 * * 1-5"
      end: "5 8-18 * * 1-5"
      replicas: 2
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  # The worker's drain_timeout is this minus 120 s (SCRIBE_DRAIN_TIMEOUT_S, set
  # by the template; 14280 s default in apps/meeting-agent/scribe/config.py): a
  # draining pod takes no new job and lets every meeting it serves end, and a
  # job the drain cuts off still has two minutes to post /agent/finished.
  terminationGracePeriodSeconds: 14400
  otlpEndpoint: ""
  secrets:
    livekitApiKey: { name: uniwork-livekit, key: LIVEKIT_API_KEY }
    livekitApiSecret: { name: uniwork-livekit, key: LIVEKIT_API_SECRET }
    sttApiKey: { name: uniwork-assemblyai-api-key, key: ASSEMBLYAI_API_KEY }
  # Egress besides uniwork-be and DNS (NetworkPolicy matches IPs, not names).
  # livekit: every address the agent's LiveKit URL resolves to, plus the
  # livekit node's private IP (ICE host candidate). Ports follow this cluster's
  # LiveKit: signalling 7880, ICE TCP 7881, UDP mux 7882, TURN UDP 3478, and
  # rtc 50000–60000.
  # stt: AssemblyAI publishes no fixed range, so 443 stays open to any
  # address until ops pin one.
  egress:
    livekit:
      # 101.99.38.253: public ELB VIP livekit.uniworkos.com resolves to.
      # 10.60.10.29: current shared worker running LiveKit hostNetwork
      # (pool-data x58q4); ICE host candidate while useExternalIp is false.
      cidrs:
        - 101.99.38.253/32
        - 10.60.10.29/32
      ports:
        - { port: 443, protocol: TCP }
        - { port: 7880, protocol: TCP }
        - { port: 7881, protocol: TCP }
        - { port: 7882, protocol: UDP }
        - { port: 3478, protocol: UDP }
        - { port: 50000, endPort: 60000, protocol: UDP }
    stt:
      - { cidr: "0.0.0.0/0", port: 443, protocol: TCP }
    # Anything else the agent must reach, e.g. the OTLP collector when
    # otlpEndpoint is set: { cidr, port, protocol }.
    extra: []
