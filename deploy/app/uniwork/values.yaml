namespace: uniwork

imagePullSecrets:
  - name: harbor-registry

nodeSelector:
  workload: app
tolerations: []

# Non-secret KEY=value files from deploy/app/env/*.env (helm --set-file).
env:
  beContent: ""
  feContent: ""
  officeEngineContent: ""

public:
  origin: https://uniworkos.com
  livekitUrl: wss://livekit.vn247.info:7880

be:
  # One replica until ADR 0025 §3 holds: several background loops (Email Hub
  # sends, digests, …) are unsafe on two replicas without a leader lock.
  replicaCount: 1
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-be
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  port: 8080
  # Prometheus listener. Must match METRICS_ADDR in deploy/app/env/uniwork-be.env
  # (the server only opens it when that variable is set).
  metricsPort: 9090
  # GOMEMLIMIT in deploy/app/env/uniwork-be.env tracks limits.memory (~80%).
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  secrets:
    database: { name: uniwork-db, key: DATABASE_URL }
    redis: { name: uniwork-redis, key: REDIS_URL }
    app: { name: uniwork-app, key: JWT_SECRET }
    preview: { name: uniwork-preview, key: PREVIEW_CAPABILITY_SECRET }
    livekitKey: { name: uniwork-livekit, key: LIVEKIT_API_KEY }
    livekitSecret: { name: uniwork-livekit, key: LIVEKIT_API_SECRET }
    # Optional — create when enabling mail / CMC S3 / Google OAuth.
    mail: { name: uniwork-mail, key: SMTP_PASSWORD }
    s3: { name: uniwork-s3, accessKey: AWS_ACCESS_KEY_ID, secretKey: AWS_SECRET_ACCESS_KEY }
    google: { name: uniwork-google, key: GOOGLE_CLIENT_SECRET }
    emailHub: { name: uniwork-email-hub, key: EMAIL_HUB_CREDENTIAL_KEY }
    # OpenRouter / OpenAI-compatible key (Email Hub AI, Ask UNI, meeting summary).
    openAPIKey: { name: uniwork-open-api-key, key: OPENAI_API_KEY }
    anthropicAPIKey: { name: uniwork-anthropic-api-key, key: ANTHROPIC_API_KEY }
    # Office engine credentials (same Secret as officeEngine.secrets). Optional:
    # without them the BE has no engine and refuses office jobs.
    officeEngineServiceToken: { name: uniwork-office-engine, key: OFFICE_ENGINE_SERVICE_TOKEN }
    officeEngineGrantKey: { name: uniwork-office-engine, key: OFFICE_ENGINE_GRANT_KEY }

fe:
  # The Next app keeps no per-pod state (no route handlers, middleware, ISR or
  # server actions; every pod of one image serves the same build), so two
  # replicas ride out a node drain or a crash. A PodDisruptionBudget is
  # rendered whenever this is above 1.
  replicaCount: 2
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-fe
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }

networkPolicy:
  livekitTunnelCidr: "10.244.217.192/32"
  # Namespace of the in-cluster Prometheus allowed to scrape be.metricsPort.
  # Empty renders no rule: the port stays closed to every other pod.
  metricsScrapeNamespace: ""
  # Egress of the office engine to the file store. NetworkPolicy matches IPs,
  # not DNS names — CMC S3 hn-2 A records (re-check if the endpoint moves).
  officeEngineFileStore:
    - { cidr: "113.20.100.19/32", port: 443 }
    - { cidr: "113.20.100.20/32", port: 443 }

# Office engine (apps/office-engine): always on in production. Non-secret env is
# deploy/app/env/uniwork-office-engine.env (helm --set-file env.officeEngineContent).
# Secrets: uniwork-office-engine (SERVICE_TOKEN + GRANT_KEY). Chart sets
# OFFICE_ENGINE_URL on the BE to the in-cluster Service.
officeEngine:
  enabled: true
  replicaCount: 1
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-office-engine
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  # Must match OFFICE_ENGINE_PORT in uniwork-office-engine.env.
  port: 8090
  # tmpfs pages count against the memory limit: 1Gi /tmp (2 workers x 512 MiB
  # temp — a 200 MiB job holds input + output + headroom on disk) + 2 x 512 MiB
  # job RSS + the service itself stays under 2560Mi.
  # Measured (SIZE-OPS1, framed input, arm64): two concurrent 200 MiB jobs
  # (odt->docx convert + xlsx open) peaked at 769 MiB cgroup memory, 386 MiB of
  # it /tmp, no OOM. The request is that peak x 1.25. The limit keeps the full
  # tmpfs budget plus job RSS: those jobs wrote small outputs, and a job whose
  # output is as large as its input fills /tmp further.
  tmpSizeLimit: 1Gi
  terminationGracePeriodSeconds: 15
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 2560Mi }
  securityContext:
    # The supervisor runs as uid 0 to drop each worker to its slot uid; every
    # capability it does not need stays dropped (compose cap_add list). The
    # container also sets allowPrivilegeEscalation=false (no-new-privileges)
    # and readOnlyRootFilesystem. Compose caps the container at pids_limit 256;
    # a pod spec has no per-pod pids field, so enforce the same ceiling on the
    # node with the kubelet `podPidsLimit: 256` (KubeletConfiguration) for the
    # nodes that carry this pool.
    addCapabilities: [CHOWN, SETUID, SETGID, KILL, DAC_OVERRIDE, FOWNER]
  # Existing Secret (created out of band) holding the two engine credentials.
  # The BE reads the same Secret through be.secrets.officeEngine*.
  secrets:
    # Service credential the BE sends; >= 32 chars.
    serviceToken: { name: uniwork-office-engine, key: OFFICE_ENGINE_SERVICE_TOKEN }
    # Grant signing key; >= 32 chars and DIFFERENT from the service token.
    grantKey: { name: uniwork-office-engine, key: OFFICE_ENGINE_GRANT_KEY }

# AI scribe agent (apps/meeting-agent, ADR 0036; spec 2026-10-20-meeting-scribe-agent-design
# §4.6). Off until the STT vendor's data-processing agreement is signed (parent
# spec §7.5) and ops confirm the shared LiveKit is >= v1.9.12 (S0 results §1).
# Turn on together with MEETING_SCRIBE_ENABLED=true in uniwork-be.env.
# Secret uniwork-meeting-agent: LIVEKIT_API_KEY, LIVEKIT_API_SECRET, ASSEMBLYAI_API_KEY.
meetingAgent:
  enabled: false
  agentName: uniwork-scribe
  sttProvider: assemblyai
  image:
    registry: registry-harbor.ubos.vn/uniwork
    repository: uniwork-meeting-agent
    tag: pending
    digest: ""
    requireDigest: true
    pullPolicy: IfNotPresent
  healthPort: 8081
  # Prometheus endpoint of the worker (scribe_* metrics, multiprocess mode).
  metricsPort: 9100
  # LiveKit URL the agent dials; empty = public.livekitUrl. It must resolve to
  # an address egress.livekit.cidrs allows.
  livekitUrl: ""
  # LiveKit docs: 10-25 jobs per 4 CPU / 8 GB pod; the worker refuses jobs past
  # load_threshold 0.7, keeps one warm job process per CPU (SCRIBE_IDLE_PROCESSES
  # defaults to the CPU count) and the HPA adds pods at 50% CPU.
  minReplicas: 1
  maxReplicas: 6
  resources:
    requests: { cpu: "4", memory: 8Gi }
    limits: { cpu: "4", memory: 8Gi }
  # The worker's drain_timeout is this minus 120 s (SCRIBE_DRAIN_TIMEOUT_S, set
  # by the template; 14280 s default in apps/meeting-agent/scribe/config.py): a
  # draining pod takes no new job and lets every meeting it serves end, and a
  # job the drain cuts off still has two minutes to post /agent/finished.
  terminationGracePeriodSeconds: 14400
  otlpEndpoint: ""
  secrets:
    livekitApiKey: { name: uniwork-meeting-agent, key: LIVEKIT_API_KEY }
    livekitApiSecret: { name: uniwork-meeting-agent, key: LIVEKIT_API_SECRET }
    sttApiKey: { name: uniwork-meeting-agent, key: ASSEMBLYAI_API_KEY }
  # Egress besides uniwork-be and DNS (NetworkPolicy matches IPs, not names).
  # livekit: every address the agent's LiveKit URL resolves to (and the TURN
  # server, if media relays through one), on the signalling ports and the RTC
  # media range the LiveKit server config opens (rtc.port_range_start/end,
  # tcp_port). The default is the in-cluster tunnel address; set the public
  # IPs when the agent dials the public URL (runbook MeetingScribeCannotJoin).
  # stt: AssemblyAI publishes no fixed range, so 443 stays open to any
  # address until ops pin one.
  egress:
    livekit:
      cidrs: ["10.244.217.192/32"]
      ports:
        - { port: 443, protocol: TCP }
        - { port: 7880, protocol: TCP }
        - { port: 7881, protocol: TCP }
        - { port: 50000, endPort: 60000, protocol: UDP }
    stt:
      - { cidr: "0.0.0.0/0", port: 443, protocol: TCP }
    # Anything else the agent must reach, e.g. the OTLP collector when
    # otlpEndpoint is set: { cidr, port, protocol }.
    extra: []
