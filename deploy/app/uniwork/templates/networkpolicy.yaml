apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uniwork
  namespace: {{ .Values.namespace }}
  labels:
    allow-from-reap-edge: "true"
spec:
  {{- if .Values.officeEngine.enabled }}
  # The office engine has its own tighter policy below; this one (egress: all)
  # would otherwise union with it and reopen the engine's egress.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [uniwork-office-engine, uniwork-meeting-agent]
  {{- else }}
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [uniwork-meeting-agent]
  {{- end }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reap-edge
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.livekitTunnelCidr | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.meetingAgent.enabled }}
    # The AI scribe calls the agent API (/api/v1/meetings/{id}/agent/*).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: uniwork-meeting-agent
      ports:
        - protocol: TCP
          port: {{ .Values.be.port }}
    {{- end }}
    {{- with .Values.networkPolicy.metricsScrapeNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.be.metricsPort }}
    {{- end }}
  egress:
    - {}
{{- if .Values.officeEngine.enabled }}
---
# Office engine: only uniwork-be calls it; it reaches only the file store and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uniwork-office-engine
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uniwork-office-engine
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: uniwork-be
      ports:
        - protocol: TCP
          port: {{ .Values.officeEngine.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.officeEngineFileStore }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .port | default 443 }}
    {{- end }}
{{- end }}
{{- if .Values.meetingAgent.enabled }}
---
# AI scribe: nothing calls it but its own health probe; it reaches only
# uniwork-be, LiveKit and the STT vendor (spec §4.6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uniwork-meeting-agent
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uniwork-meeting-agent
  policyTypes: [Ingress, Egress]
  # Only Prometheus, on the metrics port; the health port is the kubelet's.
  ingress:
    {{- with .Values.networkPolicy.metricsScrapeNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.meetingAgent.metricsPort }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: uniwork-be
      ports:
        - { protocol: TCP, port: {{ .Values.be.port }} }
    {{- range $cidr := .Values.meetingAgent.egress.livekit.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        {{- range $.Values.meetingAgent.egress.livekit.ports }}
        - protocol: {{ .protocol }}
          port: {{ .port }}
          {{- with .endPort }}
          endPort: {{ . }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- range concat .Values.meetingAgent.egress.stt .Values.meetingAgent.egress.extra }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - { protocol: {{ .protocol }}, port: {{ .port }} }
    {{- end }}
{{- end }}
