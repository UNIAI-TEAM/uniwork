apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uniwork
  namespace: {{ .Values.namespace }}
  labels:
    allow-from-reap-edge: "true"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reap-edge
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.livekitTunnelCidr | quote }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
