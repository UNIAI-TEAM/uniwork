{{- $env := .Values.env | default dict }}
{{- if $env.beContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: uniwork-be
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uniwork-be
  annotations:
    uniwork.io/env-layer: be
data:
{{- include "uniwork.envFileData" $env.beContent | nindent 2 }}
{{- else }}
{{- fail "env.beContent is required (helm --set-file env.beContent=deploy/app/env/uniwork-be.env)" }}
{{- end }}
---
{{- if $env.feContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: uniwork-fe
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uniwork-fe
  annotations:
    uniwork.io/env-layer: fe
data:
{{- include "uniwork.envFileData" $env.feContent | nindent 2 }}
{{- else }}
{{- fail "env.feContent is required (helm --set-file env.feContent=deploy/app/env/uniwork-fe.env)" }}
{{- end }}
{{- if .Values.officeEngine.enabled }}
---
{{- if $env.officeEngineContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: uniwork-office-engine
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uniwork-office-engine
  annotations:
    uniwork.io/env-layer: office-engine
data:
{{- include "uniwork.envFileData" $env.officeEngineContent | nindent 2 }}
{{- else }}
{{- fail "env.officeEngineContent is required when officeEngine.enabled (helm --set-file env.officeEngineContent=deploy/app/env/uniwork-office-engine.env)" }}
{{- end }}
{{- end }}
