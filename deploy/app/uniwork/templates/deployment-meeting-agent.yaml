{{- if .Values.meetingAgent.enabled }}
{{- $ma := .Values.meetingAgent }}
{{- /* The NetworkPolicy matches IPs, so the URL and the egress CIDRs are set
       together; no default could name an address both agree on. */}}
{{- if not $ma.egress.livekit.cidrs }}
{{- fail "meetingAgent.egress.livekit.cidrs is required: every address meetingAgent.livekitUrl resolves to (runbook MeetingScribeCannotJoin)" }}
{{- end }}
# The AI scribe (apps/meeting-agent, ADR 0038): LiveKit Agents worker, one job
# per meeting, explicit dispatch only. Spec 2026-10-20-meeting-scribe-agent-design §4.6.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniwork-meeting-agent
  namespace: {{ .Values.namespace }}
spec:
  # No replicas: the HPA below owns the count, and helm upgrade must not reset it.
  selector:
    matchLabels:
      app.kubernetes.io/name: uniwork-meeting-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uniwork-meeting-agent
        reap.io/pool: pool-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $ma.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: uniwork
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      # A worker drains on SIGTERM: it takes no new job and lets every meeting
      # it serves run to its end, which can be hours (spec §4.6: 4 h).
      terminationGracePeriodSeconds: {{ $ma.terminationGracePeriodSeconds }}
      containers:
        - name: uniwork-meeting-agent
          image: {{ include "uniwork.image" $ma.image | quote }}
          imagePullPolicy: {{ $ma.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - name: health
              containerPort: {{ $ma.healthPort }}
            - name: metrics
              containerPort: {{ $ma.metricsPort }}
          env:
            - { name: MEETING_SCRIBE_AGENT_NAME, value: {{ $ma.agentName | quote }} }
            - { name: SCRIBE_STT_PROVIDER, value: {{ $ma.sttProvider | quote }} }
            # Empty: the agent follows AI_MEETING_TRANSCRIBE_BASE_URL (scribe/config.py stt_base_url).
            - { name: SCRIBE_STT_BASE_URL, value: {{ $ma.sttBaseUrl | quote }} }
            {{- $be := include "uniwork.envFileData" ((.Values.env | default dict).beContent | default "") | fromYaml | default dict }}
            - { name: AI_MEETING_TRANSCRIBE_BASE_URL, value: {{ get $be "AI_MEETING_TRANSCRIBE_BASE_URL" | default "" | quote }} }
            - { name: SCRIBE_HEALTH_PORT, value: {{ $ma.healthPort | quote }} }
            - { name: SCRIBE_METRICS_PORT, value: {{ $ma.metricsPort | quote }} }
            # Two minutes under the grace period: a job the drain cuts off still
            # flushes its segments and reports /agent/finished before the kill.
            - { name: SCRIBE_DRAIN_TIMEOUT_S, value: {{ sub (int $ma.terminationGracePeriodSeconds) 120 | quote }} }
            - { name: UNIWORK_API_URL, value: "http://uniwork-be:{{ .Values.be.port }}" }
            - { name: LIVEKIT_URL, value: {{ required "meetingAgent.livekitUrl is required, set with meetingAgent.egress.livekit.cidrs" $ma.livekitUrl | quote }} }
            {{- with $ma.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            - name: LIVEKIT_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $ma.secrets.livekitApiKey.name }}, key: {{ $ma.secrets.livekitApiKey.key }} } }
            - name: LIVEKIT_API_SECRET
              valueFrom: { secretKeyRef: { name: {{ $ma.secrets.livekitApiSecret.name }}, key: {{ $ma.secrets.livekitApiSecret.key }} } }
            - name: ASSEMBLYAI_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $ma.secrets.sttApiKey.name }}, key: {{ $ma.secrets.sttApiKey.key }}, optional: true } }
          resources:
            {{- toYaml $ma.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /worker, port: health }
            initialDelaySeconds: 10
            periodSeconds: 5
{{- if not $ma.keda.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uniwork-meeting-agent
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uniwork-meeting-agent
  minReplicas: {{ $ma.minReplicas }}
  maxReplicas: {{ $ma.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
{{- end }}
{{- end }}
